<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不動産鑑定評価基準 暗記テストアプリ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/7.0.0/diff.min.js"></script>
    
    <style>
        body {
            font-family: sans-serif;
            margin: 10px 20px; 
            background-color: #ffffff;
            color: #333333;
        }
        h1 {
            font-size: 1.3em;
            margin: 5px 0 10px 0;
        }
        h2 {
            font-size: 1em; 
            margin: 10px 0 5px 0;
            color: #333333;
        }
        p {
            margin: 5px 0;
        }
        /* プルダウンメニューの見た目を調整 */
        select {
            font-size: 1.2em;
            padding: 5px;
            margin-bottom: 10px;
            width: 100%;
        }
        #user-answer {
            font-size: 1.3em; 
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            font-size: 1.1em;
            padding: 8px 12px;
            margin-right: 10px;
            margin-top: 5px;
        }
        #result-area {
            font-size: 1.2em; 
            line-height: 1.6;
            margin-bottom: 10px;
        }
        #model-answer-area {
            font-size: 1.2em;
            line-height: 1.6;
            color: #000000; 
            margin-bottom: 60px; 
        }
        #feedback-area {
            display: none;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>鑑定理論 暗記テスト</h1>
    
    <h2>【お題を選ぶ】</h2>

    <!-- 学習モード・重要度での絞り込みメニュー -->
    <label for="importance-filter">学習モード・重要度で絞り込み:</label>
    <select id="importance-filter" style="margin-bottom: 10px;">
        <option value="all">すべて表示</option>
        <option value="new">新規問題（未解答）</option> 
        <option value="review">復習モード（忘却曲線対応）</option> 
        <option value="S">Sランクのみ</option>
        <option value="A">Aランクのみ</option>
        <option value="B">Bランクのみ</option>
        <option value="C">Cランクのみ</option>
    </select>
    <br>

    <label for="question-select">問題を選択:</label>
    <select id="question-select">
        <!-- JavaScriptで選択肢が自動追加されます -->
    </select>

    <h2>【あなたの解答】</h2>
    <textarea id="user-answer" rows="4" placeholder="ここに解答を入力、または音声入力"></textarea>
    
    <div>
        <button id="start-voice">🎤 音声入力スタート</button>
        <button id="check-answer">採点する</button>
    </div>

    <div id="feedback-area">
        <h2>【採点結果】</h2>
        <div id="result-area"></div>
        
        <h2>【模範解答】</h2>
        <div id="model-answer-area"></div>
    </div>
<!-- 前略：既存のフィードバックエリアなど -->
    <div id="feedback-area">
        <h2>【採点結果】</h2>
        <div id="result-area"></div>
        <h2>【模範解答】</h2>
        <div id="model-answer-area"></div>
    </div>

    <!-- 🌟 ここから追加：データ引継ぎエリア 🌟 -->
    <hr style="margin-top: 40px; border: none; border-top: 1px dashed #ccc;">
    <h2>【データ引継ぎ（PC ↔ iPad）】</h2>
    <p style="font-size: 0.9em; color: #666;">※Apple製品同士なら、片方でコピーしてもう片方でペーストできます。</p>
    <button id="export-btn">📤 学習履歴をコピーして書き出す</button>
    <button id="import-btn">📥 コピーした履歴を読み込む</button>
    <!-- 🌟 ここまで追加 🌟 -->
    <!-- ⭕️ ここから追加：システム動作テスト用ボタン ⭕️ -->
    <hr style="margin-top: 40px; border: none; border-top: 1px dashed #ccc;">
    <h2>【システム動作テスト用】</h2>
    <button onclick="
        if (!window.dayOffset) window.dayOffset = 0;
        window.dayOffset += 24 * 60 * 60 * 1000; // 24時間をミリ秒で足す
        if (!window.originalDateNow) window.originalDateNow = Date.now;
        
        // アプリ内の時計を強制的に未来に書き換える
        Date.now = function() { return window.originalDateNow() + window.dayOffset; };
        
        // 強制的に復習モードに切り替えてリストを更新
        const filter = document.getElementById('importance-filter');
        filter.value = 'review';
        filter.dispatchEvent(new Event('change'));
        
        // 未来の日付で履歴が上書きされるのを防ぐため、採点ボタンをロック
        document.getElementById('check-answer').disabled = true;
        document.getElementById('check-answer').innerText = '🔒 テスト中は採点できません';
        
        alert('⏰ アプリ内の時計を【 ' + (window.dayOffset / (24*60*60*1000)) + '日後 】に進めました！\n\n復習モードに「その日に復活する予定の問題」が表示されています。\n※元に戻すには画面を更新（リロード）してください。');
    " style="background-color: #ff9800; color: white; padding: 10px 15px; font-weight: bold; border: none; border-radius: 5px; margin-bottom: 30px;">
    ⏩ 時計を1日進める（明日をシミュレーション）
    </button>
    <!-- ⭕️ ここまで追加 ⭕️ -->

    <script src="script.js"></script>
</body>
</html>
